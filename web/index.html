<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Art Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <p class="kicker">GO / WASM IMAGE LAB</p>
      <h1>Pixel Art Studio</h1>
      <p class="intro">Turn an image into crisp, color-blocked pixel art directly in your browser.</p>
    </header>

    <section class="workspace">
      <div class="controls">
        <label class="dropzone" for="image-input">
          <span class="drop-title">Choose an image</span>
          <span id="file-name">PNG, JPEG, or WebP</span>
          <input id="image-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
        </label>
        <div class="fields">
          <label>Pixel width <span class="hint">0 keeps source dimensions</span><input id="pixel-width" type="number" min="0" max="2048" value="0"></label>
          <label>Scale <span class="hint">Output enlargement factor</span><input id="scale" type="number" min="1" max="32" value="8"></label>
          <label>Tile size <span class="hint">Mosaic tile width and height</span><input id="tile-size" type="number" min="1" max="128" value="16"></label>
          <label id="palette-size-field">Palette size <span class="hint">Color palette limit in pixel mode</span><input id="palette-size" type="number" min="1" max="256" value="8"></label>
        </div>
        <label class="mode"> <input id="mosaic" type="checkbox"> Mosaic mode</label>
        <label id="bundled-palette-field">Bundled palette <span class="hint">Used when no palette tiles are uploaded</span>
          <select id="bundled-palette">
            <option value="minecraft-icons.json">Minecraft icons</option>
            <option value="dota-icons.json">Dota 2 icons</option>
          </select>
        </label>
        <label class="dropzone compact" for="palette-input">
          <span class="drop-title">Palette tiles</span>
          <span id="palette-name">Bundled palette or upload files</span>
          <input id="palette-input" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple>
        </label>
        <button id="process" type="button" disabled>Process image</button>
        <p id="status" role="status">Loading WASM engine...</p>
      </div>

      <div class="preview-grid">
        <figure><figcaption>Original</figcaption><div class="preview"><img id="original" alt="Original upload"></div></figure>
        <figure><figcaption>Pixel art</figcaption><div class="preview checker"><img id="result" alt="Pixel art result"></div></figure>
      </div>

      <a id="download" class="download" download="pixel-art.png" hidden>Download IMAGE</a>
    </section>
  </main>
  <script src="wasm_exec.js"></script>
  <script src="app.js"></script>
</body>
</html>
